<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Пружинного Маятника</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .simulation {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .simulation h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .simulation iframe {
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>Симуляция Пружинных Маятников</h1>
    <div class="container">
    
        <div class="simulation">
            <h2>Две пружины</h2>
            <iframe src="Task1/TwoSprings/index.html" width="850" height="650"></iframe>
        </div>
    
        <div class="simulation">
            <h2>Три пружины</h2>
            <iframe src="Task1/ThreeSprings/index.html" width="850" height="650"></iframe>
        </div>
    
        <div class="simulation">
            <h2>Деформируемое тело</h2>
            <iframe src="Task2/simulation.html" width="850" height="650"></iframe>
        </div>
    
    </div>
</body>
</html>
